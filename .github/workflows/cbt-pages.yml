name: Deploy CBT to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "cbt/**"
      - "js/config.js"
      - ".github/workflows/cbt-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-cbt"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare CBT site
        run: |
          mkdir -p _site
          cp -r cbt/* _site/
          mkdir -p _site/js
          cp js/config.js _site/js/config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
